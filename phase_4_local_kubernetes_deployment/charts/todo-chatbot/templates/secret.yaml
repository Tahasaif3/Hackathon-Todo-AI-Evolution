apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default "todo-app" }}
  labels:
    helm.sh/chart: {{ include "todo-chatbot.chart" . }}
    app.kubernetes.io/name: {{ include "todo-chatbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
