apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  namespace: {{ .Values.namespace | default "todo-app" }}
  labels:
    helm.sh/chart: {{ include "todo-chatbot.chart" . }}
    app.kubernetes.io/name: {{ include "todo-chatbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  NEXT_PUBLIC_API_URL: {{ .Values.config.nextPublicApiUrl | quote }}
  ENVIRONMENT: {{ .Values.config.environment | default "development" | quote }}
