apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "localhost:9092"  # Update this for your Kafka broker address
  - name: consumerGroup
    value: "audit-service-group"
  - name: clientID
    value: "audit-service"
  - name: authType
    value: "none"