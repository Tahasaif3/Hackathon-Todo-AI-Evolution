# Local Development Values for Todo Chatbot Helm Chart
# Copy this file to values-local.yaml and fill in your values

# Namespace configuration
namespace: todo-app

# Frontend configuration
frontend:
  replicaCount: 2

  image:
    repository: todo-chatbot-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 3000
    nodePort: 30080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Backend configuration
backend:
  replicaCount: 2

  image:
    repository: todo-chatbot-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8000
    nodePort: 30081

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Non-sensitive configuration
config:
  nextPublicApiUrl: "https://tahasaif3-ai-taskflow-backend.hf.space"
  environment: "development"

