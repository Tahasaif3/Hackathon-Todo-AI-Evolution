# Default values for todo-platform

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  domain: "localhost"

# Pod security context
podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Frontend configuration
frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  env:
    DATABASE_URL: ""
    BETTER_AUTH_SECRET: ""
    JWT_SECRET_KEY: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Audit service configuration
auditService:
  replicaCount: 1
  image:
    repository: audit-service
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    DATABASE_URL: "postgresql://user:password@postgres:5432/audit_db"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Notification service configuration
notificationService:
  replicaCount: 1
  image:
    repository: notification-service
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Dapr configuration for Kafka
dapr:
  kafka:
    brokers: "localhost:9092"
    consumerGroup: "dapr-consumer-group"
    clientID: "dapr"
    authType: "anonymous"
    username: ""
    password: ""
    authScheme: ""

# PostgreSQL configuration (external for cloud)
externalPostgreSQL:
  enabled: false
  host: "localhost"
  port: 5432
  database: "todo_db"
  username: "postgres"
  password: "password"
  sslmode: "disable"

# Kafka configuration (external for cloud)
externalKafka:
  enabled: false
  brokers: []

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Namespace for deployment
namespace: "todo-platform"