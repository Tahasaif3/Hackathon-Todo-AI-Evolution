apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-platform.fullname" . }}-audit-service
  labels:
    {{- include "todo-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    {{- include "todo-platform.selectorLabels" . | nindent 4 }}
    app: audit-service